<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Loaded here (not via CSS @import) so it fetches in parallel with the
         page instead of blocking on the stylesheet parse — a slow/blocked
         @import is what made different sections briefly render in different
         fallback fonts before Inter kicked in. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twedot — The Open Network for People and Businesses</title>
    <meta name="description" content="Twedot is the open network for people and businesses. Connect with friends and family, discover local businesses worldwide, do business while staying social — all in one place." />
    <meta name="keywords" content="Twedot, open network, social network, people and businesses, local discovery, public feed, private messaging, content monetisation, nearby services, earn from videos" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Twedot" />

    <!-- Open Graph -->
    <meta property="og:title" content="Twedot — The Open Network for People and Businesses" />
    <meta property="og:description" content="Connect with friends and family, discover people and businesses around you and worldwide, and do business while staying social. Twedot is the open network for everyone." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/founders.jpeg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Twedot — The Open Network for People and Businesses" />
    <meta name="twitter:description" content="Connect with friends and family, discover people and businesses around you and worldwide, and do business while staying social. Twedot is the open network for everyone." />
    <meta name="twitter:image" content="/founders.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
